datasets:

  left:
    name: fimmda
    file_pattern: fimmda_fort*.xlsx
    header_row: 1
    footer:
      type: empty_key
      column: isin
  right:
    name: 3cortex
    file_pattern: cumulative*.xlsx
    header_row: 1
    footer:
      type: empty_key
      column: isin

join:

  keys:
    - isin
    - date_dealt
options:

  trim_strings: true
  case_insensitive_strings: true


tolerance_presets:

  tenor:
    abs: 0.000001

  numeric_2dp:
    abs: 0.01


column_mapping:

  tenor:
    left: Residual Tenor*
    right: Residual Tenor*

  isin:
    left: ISIN
    right: ISIN

  description:
    left: Description*
    right: Description*

  coupon:
    left: Coupon*
    right: Coupon*

  maturity:
    left: Maturity*
    right: Maturity*

  call_date:
    left: Next Call/Put Date*
    right: Next Call/Put Date*

  rating:
    left: nsdl*
    right: nsdl*

  segment:
    left: Segment*
    right: Segment*

  date_dealt:
    left: Date Dealt*
    right: Date Dealt*
  market_type:
    left: Primary/ Secondary*
    right: Primary/ Secondary*

  weighted_avg_yield:
    left: Weighted Avg. Yield*
    right: Weighted Avg. Yield*

  gsec_yield:
    left: G-Sec Interpolated Yield*
    right: G-Sec Interpolated Yield*

  spread:
    left: Spread over G-Sec*
    right: Spread over G-Sec*

  cum_value:
    left: Cum. Value*
    right: Cum. Value*

  trade_count:
    left: No Of Trades*
    right: No Of Trades*

  wa_price:
    left: W. A. Price*
    right: W. A. Price*

  remark:
    left: Remark*
    right: Remark*

  cal_yield_vwap:
    left: Cal. Yield for VWAP*
    right: Cal. Yield for VWAP*



columns:

  tenor:
    type: float
    label: Residual Tenor
    tolerance: tenor
    precision: 6
    summary: true
    summary_precision: 6

    highlight: true
    color: "#e3f2fd"



  isin:
    type: string
    label: ISIN



  description:
    type: string
    label: Description
    summary: true



  coupon:
    type: float
    label: Coupon
    precision: 2
    tolerance: numeric_2dp

    transform:
      left: "num"
      right: "float(str(x).replace('%',''))"

    summary: true
    summary_precision: 2

    highlight: true
    color: "#e8f5e9"



  maturity:
    type: string
    label: Maturity
    summary: true



  call_date:
    type: string
    label: Next Call/Put Date
    summary: true



  rating:
    type: string
    label: Rating
    summary: true



  segment:
    type: string
    label: Segment
    summary: true



  date_dealt:
    type: string
    label: Date Dealt
    transform:
      left: "str(x)[:10]"
      right: "str(x)[:10]"


  market_type:
    type: string
    label: Primary/ Secondary Market
    summary: true



  weighted_avg_yield:
    type: float
    label: Weighted Avg. Yield
    precision: 2
    tolerance: numeric_2dp
    summary: true
    summary_precision: 2

    highlight: true
    color: "#fff3e0"



  gsec_yield:
    type: float
    label: G-Sec Interpolated Yield
    precision: 2
    tolerance: numeric_2dp
    summary: true
    summary_precision: 2

    highlight: true
    color: "#f3e5f5"



  spread:
    type: float
    label: Spread over G-Sec
    precision: 2
    tolerance: numeric_2dp
    summary: true
    summary_precision: 2

    highlight: true
    color: "#fce4ec"



  cum_value:
    type: float
    label: Cum. Value (Cr)
    precision: 2
    tolerance: numeric_2dp
    summary: true
    summary_precision: 2

    highlight: true
    color: "#ede7f6"



  trade_count:
    type: float
    label: No Of Trades
    precision: 2
    tolerance: numeric_2dp
    summary: true
    summary_precision: 2

    highlight: true
    color: "#e0f2f1"



  wa_price:
    type: float
    label: W. A. Price
    precision: 2
    tolerance: numeric_2dp
    summary: true
    summary_precision: 2

    highlight: true
    color: "#f1f8e9"



  remark:
    type: string
    label: Remark
    summary: true
    highlight: true
    color: "#f1f8e9"


  cal_yield_vwap:
    type: string
    ignore: true



output:

  file_name: fortnightly_trades_reconciliation.xlsx