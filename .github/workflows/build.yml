name: Build CompareX Wheel

on:
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout repo
      uses: actions/checkout@v4


    # install uv
    - name: Install uv
      run: |
        curl -Ls https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH


    # cache uv python downloads (speeds builds significantly)
    - name: Cache uv
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/uv
          ~/.local/share/uv
        key: uv-${{ runner.os }}-python-3.12


    # install deterministic python version
    - name: Install Python 3.12
      run: |
        uv python install 3.12


    # build wheel
    - name: Build wheel
      run: |
        uv build


    # upload wheel artifact
    - name: Upload wheel artifact
      uses: actions/upload-artifact@v4
      with:
        name: comparex-wheel
        path: dist/*.whl
        retention-days: 7


    # optional visibility in logs
    - name: Show built files
      run: |
        ls -lh dist
