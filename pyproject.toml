[project]
name = "comparex"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.3",
    "numpy>=2.4.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "python-multipart>=0.0.22",
    "pyyaml>=6.0.3",
    "uvicorn>=0.42.0",
]
[tool.setuptools.package-data]
comparex = ["config/*.yaml"]

[tool.setuptools.packages.find]
where = ["src"]
[tool.deptry]
known_first_party = ["comparex"]
